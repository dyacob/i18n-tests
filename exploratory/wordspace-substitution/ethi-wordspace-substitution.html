<!DOCTYPE html>
<html  lang="en" >
<head>
<meta charset="utf-8">
<title>Interactive test: Wordspace Subtitution</title>
<link rel="author" title="dyacob" href="mailto:yacob@geez.org">

<link rel="stylesheet" href="../../fonts/metadata_styles.css"/>
<style>
/* the CSS below is not part of the test */
.test {
margin: 40px 5%;
width: 800px;
font-size: 36px;
border: 1px solid orange;
height: 3em;
overflow: hidden;
}
</style>
<script src="../../fonts/interactive_functions.js"> </script>
<script type="text/javascript">
	// Replace one or more space symbols with Ethiopic Wordspace
	//
	// Letters: [\u1200-\u135A\u1380-\u138F\u2D80-\u2DDE\uAB01-\uAB2E]
	// Nonpunctuation symbols: [\u1200-\u135A\u1369-\u138F\u2D80-\u2DDE\uAB01-\uAB2E]
	// Punctuatioon symbols: [\u135B-\u1368]
	// Numbers: [\u1369-\u137C]
	// Numbers And Punctuation: [\u1358-\u137C]
	// Tonal Marks: [\u1390-\u1399]  -these absolutely should not be applicable
	// Opening Punctuation: [\u7B\u5B\u28\uAB\u2039\u201C\u2018]  /  {[(«‹“‘
	// Closing Punctuation: [\u2019\u201D\u203A\uBB\u29\u5D\u7D]  /  ’”›»)]}


	let spacesBetweenLetters = /([\u1200-\u135A\u1380-\u138F\u2D80-\u2DDE\uAB01-\uAB2E])( +)([\u1200-\u135A\u1380-\u138F\u2D80-\u2DDE\uAB01-\uAB2E])/g;
	let spacesBetweenLetterAndNumberOrOpenPunct = /([\u1200-\u135A\u1380-\u138F\u2D80-\u2DDE\uAB01-\uAB2E])( +)([{\[(\uAB\u2039\u201C\u2018\u1369-\u137C])/g;
	let spacesBetweenNumberOrClosePunctAndLetter = /([\u2019\u201D\u203A\uBB)\]}\u1369-\u137C])( +)([\u1200-\u135A\u1380-\u138F\u2D80-\u2DDE\uAB01-\uAB2E])/g;
	let endOfLine = /([\u1200-\u135A\u1380-\u138F\u2D80-\u2DDE\uAB01-\uAB2E\u2019\u201D\u203A\uBB\u29\u5D\u7D])\n/g;

	var fromSpaceToWordspace = true;
	function setSubstitutionDirection (value) {
		if( value == "fromAscii" ) {
			fromSpaceToWordspace = true;
		}
		else {
			fromSpaceToWordspace = false;
		}
	}

	function spaceToWordspace(textIn) {
		var step1 = textIn.replace( spacesBetweenLetters, '$1፡$3' );
		var step2 = step1.replace( spacesBetweenLetterAndNumberOrOpenPunct, '$1፡$3' );
		var step3 = step2.replace( spacesBetweenNumberOrClosePunctAndLetter, '$1፡$3' );
		var step4 = step3.replace( endOfLine, '$1፡\n' );
		var textOut = step4.replace( /([\u1200-\u135A\u1380-\u138F\u2D80-\u2DDE\uAB01-\uAB2E])$/, '$1፡' );
		return textOut;
	}
	function wordspaceToSpace(textIn) {
		var step1 = textIn.replace( /፡፡/g, '።');
		var step2 = step1.replace( /፡-/g, '፦' );
		var textOut = step2.replace( /( )?፡( )?/g, ' ' );
		return textOut;
	}
	function substituteSpaces() {
		var textIn = document.getElementById('in').value;
		var textOut;
		if( fromSpaceToWordspace ) {
			textOut = spaceToWordspace( textIn );
		}
		else {
			textOut = wordspaceToSpace( textIn );
		}
		document.getElementById('normal').innerHTML = textOut;
		document.getElementById('textarea').value = textOut;
      	}
</script>
</head>
<body>
<h1>Interactive test: Ethiopic wordspace substitution</h1>

<p class="advice">
Set font size&nbsp;<input id="fontSize" min="10" max="120" step="1" value="36" oninput="setFontSize(this.value)" type="range"/> 
<span id="sizeOfFont" style="font-size:80%;">36</span>px<br/>

Set the font to <input id="fontFamily" type="text" onChange="setFont(this.value)"/> <button onClick="setFont(document.getElementById('fontFamily').value)">Apply</button>
</p>

<div class="advice">Adjust the width of the test boxes.<br/>
<input id="boxWidth" min="10" max="1000" step="1" value="800" oninput="setBoxWidth(this.value)" style="width:80%; margin-left: 5%;" type="range"> <span id="wSizeIndicator" style="font-size:80%;">800</span>px</div>


<!-- INPUT AREA -->
<div><textarea id="in" type="text" placeholder="Add text to be tested text here and click on GO." dir="auto"></textarea> 
<button onClick="setText(document.getElementById('in').value);substituteSpaces()" id="go" style="vertical-align: top;">Go</button>
<br/>
<label onClick="setSubstitutionDirection('fromAscii')"><input type="radio"checked  value="fromAscii" id="fromAscii" name="substitutionDirection"/><code>Space to Wordspace</code></label>
<label onClick="setSubstitutionDirection('fromEthi')"><input type="radio" value="fromEthi" id="fromEthi" name="substitutionDirection"/><code>Wordspace to Space</code></label>
</input>
</div>



<!-- TESTS -->
<div class="test" id="normal" dir="auto"></div>

<textarea class="test" id="textarea" dir="auto"></textarea>



<!-- INFO -->
<div id="info" style="clear: both; position: inherit;">
<ul class="notes">
<li>The top test box is HTML. The bottom one is a textarea.</li>
<li>Browser: <span id="version"></span></li>
<li><button onClick="document.getElementById('snapshot').value = snapParameters(); document.getElementById('snapshot').select()">Take a snapshot</button>: <input id="snapshot" style="width:30em;" /></li>
</ul>
</div>
<script>
document.getElementById('version').innerHTML = navigator.userAgent

// check for parameters and take appropriate action
parameters = location.search.split('&')
parameters[0] = parameters[0].substring(1)
for (var p=0;p<parameters.length;p++) {  
	pairs = parameters[p].split('=');
	if (pairs[0] == 'fontSize' && pairs[1]) {
					setFontSize(pairs[1]) 
					document.getElementById('fontSize').value = pairs[1] 
					}
	if (pairs[0] == 'fontFamily' && pairs[1]) {
					setFont(pairs[1]) 
					document.getElementById('fontFamily').value = pairs[1] 
					}
	if (pairs[0] == 'width' && pairs[1]) { 
					setBoxWidth(pairs[1]) 
					document.getElementById('boxWidth').value = pairs[1]
					}
	if (pairs[0] == 'text' && pairs[1]) { 
					document.getElementById('in').value = decodeURIComponent(pairs[1])
					setText(decodeURIComponent(pairs[1]))
					}
	}


function snapParameters () {
// take a snapshot of the settings of the page and make available as URL parameters
// this can be picked up by the user to point to the current setup of the page

out = "https://w3c.github.io/i18n-tests/exploratory/line_breaking/int-line-break?"
if (document.getElementById('fontSize') && document.getElementById('fontSize').value != '') out += '&fontSize='+document.getElementById('fontSize').value
if (document.getElementById('fontFamily') && document.getElementById('fontFamily').value != '') out += '&fontFamily='+document.getElementById('fontFamily').value
if (document.getElementById('boxWidth')) out += '&width='+document.getElementById('boxWidth').value

out += '&text='+encodeURIComponent(document.getElementById('in').value)
return out
}
</script>
